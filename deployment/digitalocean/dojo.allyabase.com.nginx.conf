server {
    listen 80;
    listen [::]:80;
    server_name dojo.allyabase.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl ipv6only=on;
    server_name dojo.allyabase.com;

    ssl_certificate /etc/letsencrypt/live/dojo.allyabase.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dojo.allyabase.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # WebSocket support (wiki uses socket.io)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    client_max_body_size 100M;

    location / {
        proxy_pass http://localhost:3333;
    }
}
